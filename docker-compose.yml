---
# Local Foundry VTT harness for verifying packages/foundry-module/.
# See packages/foundry-module/README.md for setup and usage.

# Every checkout drives one harness: `up` from another checkout replaces the
# running container, which would otherwise collide on the port and volume.
name: woodland-generators

services:
  foundry:
    image: felddy/foundryvtt:14.370.0@sha256:24af7e8a402291d3b54443dc7266f6a8fe4a792553171c1a076e1290abda9b53
    # Foundry binds the license to the container hostname; pinning keeps the
    # license valid across `docker compose down` / `up` cycles.
    hostname: woodland-generators-foundry
    init: true
    ports:
      - "30000:30000"
    env_file:
      # Needed only on first run; a warm foundry-data volume runs without it.
      - path: .env
        required: false
    environment:
      CONTAINER_PRESERVE_CONFIG: "true"
      # Run link-module.sh from /srv/patches (outside /data) at startup.
      CONTAINER_PATCHES: "/srv/patches"
    configs:
      # The image prefers this file to its environment. Copying it in keeps
      # the credentials out of `docker inspect`.
      - source: foundry-credentials
        target: /run/secrets/config.json
    volumes:
      - foundry-data:/data
      # Mount the package outside /data; the container patch symlinks it into
      # the modules directory. Mounting into /data directly makes Docker
      # pre-create the parents as root, which the non-root foundry user can't
      # then write under.
      - ./packages/foundry-module:/srv/module:ro
      - ./packages/foundry-module/scripts/foundry-link-module.sh:/srv/patches/link-module.sh:ro

volumes:
  foundry-data:
    # Shared by every checkout so the cached build and license carry over.
    name: woodland-generators_foundry-data

# Outside Swarm, a Compose secret holds one variable's whole value, so a config
# combines the four into the JSON the image reads. A value containing `"` or
# `\` breaks it.
configs:
  foundry-credentials:
    content: |
      {
        "foundry_username": "${FOUNDRY_USERNAME:-}",
        "foundry_password": "${FOUNDRY_PASSWORD:-}",
        "foundry_license_key": "${FOUNDRY_LICENSE_KEY:-}",
        "foundry_admin_key": "${FOUNDRY_ADMIN_KEY:-}"
      }
