coverage:
  status:
    project:
      default:
        threshold: 1%
    patch:
      default:
        threshold: 1%

ignore:
  - "dist/"
  - "coverage/"
  - "scripts/"
  - "test/"
  - "test-results/"
  - "**/*.d.ts"
  - "**/*.test.ts"
  - "packages/*/src/logging/pino-pretty-transport.js"
