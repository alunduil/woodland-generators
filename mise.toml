[settings]
# Node's pin lives in .node-version, which setup-node also reads.
idiomatic_version_file_enable_tools = ["node"]
locked = true
lockfile_platforms = ["linux-x64"]

[tools]
# github: for the musl build. aqua ships only the gnu build, which needs glibc
# 2.38+, and the Debian 12 devcontainer has 2.36.
"github:lycheeverse/lychee" = { version = "0.24.2", version_prefix = "lychee-v", matching = "musl" }
pnpm = "11.28.9"
