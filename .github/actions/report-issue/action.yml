name: Report issue
description: >-
  Open an issue from a file, or update the open issue carrying the same title,
  so a recurring report stays on a single issue.

inputs:
  title:
    description: Issue title, also used to find the open report.
    required: true
  content-filepath:
    description: Markdown file holding the issue body.
    required: true
  labels:
    description: Comma-separated labels applied to the issue.
    required: true

runs:
  using: composite
  steps:
    - name: Find existing report issue
      id: report
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: ${{ inputs.title }}
      run: |
        number=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
          --search "${TITLE} in:title" --json number --jq '.[0].number // empty')
        echo "number=${number}" >>"${GITHUB_OUTPUT}"

    - name: Open or update the report issue
      uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
      with:
        title: ${{ inputs.title }}
        content-filepath: ${{ inputs.content-filepath }}
        issue-number: ${{ steps.report.outputs.number }}
        labels: ${{ inputs.labels }}
