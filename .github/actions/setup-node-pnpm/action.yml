name: Setup Node.js + pnpm
description: Install Node.js, pnpm, and the workspace's locked dependencies.

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node; overrides .node-version.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # setup-node's `cache: pnpm` needs pnpm on PATH. setup-node installs Node
    # because mise cannot resolve nvm aliases such as `lts/-1`.
    - name: Setup pnpm
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        install_args: pnpm

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .node-version
        cache: "pnpm"

    - name: Rewrite GitHub SSH URLs to HTTPS
      shell: bash
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
