name: Setup Node.js + pnpm
description: Install Node.js, pnpm, and the workspace's locked dependencies.

inputs:
  node-version:
    description: Node.js version to install instead of the mise.toml pin.
    required: false
    default: ""
  cache:
    description: >-
      Restore and save the mise tool and pnpm store caches. Any default-branch
      run can write them, so enable this only on jobs whose output nothing
      ships.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # setup-node's `cache: pnpm` needs pnpm on PATH. setup-node installs Node
    # because mise cannot resolve nvm aliases such as `lts/-1`.
    - name: Setup pnpm
      uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        install_args: pnpm
        cache: ${{ inputs.cache }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: mise.toml
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    - name: Rewrite GitHub SSH URLs to HTTPS
      shell: bash
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
