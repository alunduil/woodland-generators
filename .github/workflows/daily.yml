name: Daily

on:
  schedule:
    # Offset from the hour: on-the-hour schedules queue behind platform peak
    # load. Without the timezone field the cron would run in UTC and drift an
    # hour at each BST transition.
    - cron: "47 6 * * *"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # No cancel-in-progress: a truncated sweep loses the operations-per-run
  # resume cache and restarts from the first pull request.
  group: ${{ github.workflow }}

jobs:
  stale-pull-requests:
    name: Prune stale pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `actions: write` is omitted: it covers only the resume cache, so a
      # truncated run warns and restarts rather than failing.
      issues: write
      pull-requests: write

    env:
      DAYS_BEFORE_STALE: 30
      DAYS_BEFORE_CLOSE: 14

    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          # Disabling only the marking leg would leave an issue that already
          # carries the label eligible for closing.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: ${{ env.DAYS_BEFORE_STALE }}
          days-before-pr-close: ${{ env.DAYS_BEFORE_CLOSE }}
          # Closing a Renovate pull request tells Renovate the version is
          # unwanted and it will not re-offer it. Renovate labels nothing by
          # default, so this depends on renovate.json applying the label.
          exempt-pr-labels: dependencies
          stale-pr-message: >-
            This has been quiet for ${{ env.DAYS_BEFORE_STALE }} days, so it's
            picked up a stale label. A comment or a push clears the label and
            restarts the clock. Otherwise this closes in another
            ${{ env.DAYS_BEFORE_CLOSE }} days.
          close-pr-message: >-
            Closing this: the stale label went on
            ${{ env.DAYS_BEFORE_CLOSE }} days ago and it has stayed quiet
            since. That isn't a call on the change itself, and nothing is lost:
            the branch stays where it is, so comment here if you want to pick
            it back up and I'll reopen it.
