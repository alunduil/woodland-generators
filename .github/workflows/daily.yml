name: Daily

# Offset from the hour: on-the-hour schedules queue behind platform peak load.
on:
  schedule:
    - cron: "47 6 * * *"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialise a manual dispatch against the schedule so two sweeps cannot
  # comment on the same pull request. Queue rather than cancel, so the dispatch
  # still runs.
  group: ${{ github.workflow }}

jobs:
  stale-pull-requests:
    name: Prune stale pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      # Marking and closing are both off: switching off marking alone would
      # still close an issue that already carries the stale label.
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          # Closing a Renovate pull request tells Renovate the version is
          # unwanted, so it stops re-offering the update. Depends on
          # renovate.json applying this label; Renovate applies none by default.
          exempt-pr-labels: dependencies
          stale-pr-message: >-
            This has been quiet for 30 days, so it's picked up a stale label. A
            comment or a push clears the label and restarts the clock. Otherwise
            this closes in another 14 days.
          close-pr-message: >-
            Closing this after a long quiet stretch. That isn't a call on the
            change itself, and nothing is lost: the branch stays where it is, so
            comment here if you want to pick it back up and I'll reopen it.
