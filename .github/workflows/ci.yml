name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Test foundry-module on Node ${{ matrix.node.version }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # nvm aliases rather than literals, so the matrix auto-rotates.
        # `slug` repeats each leg without the `/` and `*` that artifact
        # names and Codecov flags reject.
        #
        # `lts/-2` is deliberately absent: between April's EOL and October's
        # new LTS it names an end-of-life line, and pnpm's Node floor sits
        # above it, so that leg cannot install at all.
        node:
          - version: "lts/-1"
            slug: lts-1
          - version: "lts/*"
            slug: lts

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node.version }}

      - name: Run tests with coverage
        run: pnpm --filter @woodland-generators/foundry-module run test:coverage

      - name: Upload Codecov reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecov-reports-foundry-module-${{ matrix.node.slug }}
          path: |
            packages/foundry-module/coverage/lcov.info
            packages/foundry-module/test-results/junit.xml
          retention-days: 1

  # Separate from `test` so a failure in Codecov's uploader cannot fail a test
  # check. `!cancelled()` rather than plain `needs`, because a failing suite is
  # when Codecov's test analytics is most useful.
  codecov:
    runs-on: ubuntu-24.04
    needs: test
    if: ${{ !cancelled() }}
    name: Upload reports to Codecov (foundry-module, Node ${{ matrix.node.version }})
    timeout-minutes: 15

    # Job scope is safe while nothing here runs project or dependency code.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        # Keep the leg set in sync with the `test` job. Coverage comes from
        # one leg, so a single Node line's V8 behaviour cannot move the
        # percentage. Test results come from every leg, because Codecov
        # classifies a flake by finding a pass and a fail on one commit.
        node:
          - version: "lts/-1"
            slug: lts-1
            coverage: false
          - version: "lts/*"
            slug: lts
            coverage: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Codecov reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codecov-reports-foundry-module-${{ matrix.node.slug }}
          path: packages/foundry-module

      - name: Upload coverage to Codecov
        if: ${{ matrix.node.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./packages/foundry-module/coverage/lcov.info
          flags: foundry-module
          name: codecov-foundry-module
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: ./packages/foundry-module/test-results/junit.xml
          flags: foundry-module,node-${{ matrix.node.slug }}
          name: test-results-foundry-module-${{ matrix.node.slug }}
          fail_ci_if_error: true

  # Per-cell contexts from `test` change with the matrix, so rulesets require
  # this job instead, under the `name:` every managed repo shares. A skipped
  # required check counts as passing, hence `always()`: under `!cancelled()` a
  # cancelled run would merge through a green gate.
  ci-results:
    runs-on: ubuntu-24.04
    needs: test
    if: ${{ always() }}
    name: Check CI results
    timeout-minutes: 5

    steps:
      - name: Fail unless every leg succeeded
        if: ${{ needs.test.result != 'success' }}
        run: exit 1

  build:
    runs-on: ubuntu-24.04
    needs: test
    name: Build every package
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build TypeScript
        run: pnpm run build

      # `analyze:bundle` dry-runs by default so contributors can weigh a
      # bundle without a Codecov account. Identity is the bundle name it
      # sets: bundle analysis has no equivalent of the `flags:` the coverage
      # uploads carry.
      - name: Upload bundle analysis to Codecov
        run: >-
          pnpm --filter @woodland-generators/foundry-module run analyze:bundle
          --no-dry-run
          --upload-token "$CODECOV_TOKEN"
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # release.yml runs this same script during a release. Running it here too
      # means a payload that won't assemble fails the pull request rather than
      # the release.
      - name: Assemble the module release assets
        run: pnpm --filter @woodland-generators/foundry-module run package

      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            packages/*/dist/
          retention-days: 7

  # Production only: dev-only advisories arrive through upstream chains we
  # can't fix, so they stay as Dependabot alerts instead of blocking the line.
  dependency-audit:
    runs-on: ubuntu-24.04
    name: Audit production dependencies
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Fail on high or critical advisories
        run: pnpm audit --prod --audit-level=high

  pre-commit:
    runs-on: ubuntu-24.04
    name: Run pre-commit hooks
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install lychee and Vale
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: github:lycheeverse/lychee vale

      # `key` and `restore-keys` have to share a prefix or every run misses the
      # cache silently, so derive it once here rather than writing it twice.
      # Only a lychee version or config change discards the cached results.
      - name: Derive the lychee cache prefix
        id: lychee-cache
        run: echo "prefix=lychee-$(lychee --version | cut -d' ' -f2)-${{ hashFiles('lychee.toml') }}" >>"$GITHUB_OUTPUT"

      # Persist lychee's URL→status cache across CI runs so unchanged links
      # don't re-hit the network every PR. lychee's own max_cache_age (1d)
      # still re-validates entries daily, so real link rot surfaces; the
      # cache_exclude_status in lychee.toml keeps transient 5xx out.
      - name: Cache lychee link-check results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: ${{ steps.lychee-cache.outputs.prefix }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.lychee-cache.outputs.prefix }}-

      # SHA pinning is transitive: an action whose own action.yml references
      # another by tag fails the run at resolution, before any step executes.
      - name: Run default-stage hooks
        uses: tox-dev/action-pre-commit-uv@9316eafda3550b0365575c60b9f53725a81d0cfd # v1.1.2
        env:
          # A push run checks out main, which no-commit-to-branch rejects.
          SKIP: no-commit-to-branch

      # A second invocation is what selects the manual stage, and it reuses
      # the hook environment the step above provisioned and cached. See
      # .pre-commit-config.yaml for why that stage exists.
      - name: Validate TOML against published schemas
        uses: tox-dev/action-pre-commit-uv@9316eafda3550b0365575c60b9f53725a81d0cfd # v1.1.2
        with:
          extra_args: --hook-stage manual --all-files tombi-lint-online

  # lychee only checks, so the hooks need no `setup`.
  fix-renovate-hooks:
    name: Fix hooks on the Renovate branch
    # yamllint disable-line rule:line-length
    uses: alunduil/renovate-config/.github/workflows/fix-renovate-hooks.yml@1b88d89996aefce883fc1583d3f173ec65f4bbca # main
    permissions:
      contents: read
      id-token: write
    with:
      node-version-file: .node-version
      hook-runner: pre-commit

  # Verified mode fails only on a credential TruffleHog confirms is live, so
  # the gate needs no allowlist. It extends GitHub push protection, which
  # matches known provider patterns only.
  secrets:
    runs-on: ubuntu-24.04
    name: Scan for live secrets
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TruffleHog scans the pushed commits, whose history a shallow clone
          # lacks.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the pushed commits
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified
