name: Pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install lychee
        run: ./scripts/install-lychee.sh

      # Persist lychee's URL→status cache across CI runs so unchanged links
      # don't re-hit the network every PR. lychee's own max_cache_age (1d)
      # still re-validates entries daily, so real link rot surfaces; the
      # cache_exclude_status in lychee.toml keeps transient 5xx out.
      - name: Cache lychee link-check results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-${{ hashFiles('scripts/install-lychee.sh', 'lychee.toml') }}-${{ github.run_id }}
          restore-keys: |
            lychee-${{ hashFiles('scripts/install-lychee.sh', 'lychee.toml') }}-

      # SHA pinning is transitive: an action whose own action.yml references
      # another by tag fails the run at resolution, before any step executes.
      - name: Run
        uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5

      # The manual stage sits outside the run above, so it takes a second
      # invocation; it reuses the hook environment that step provisioned and
      # cached. Why schema validation is staged off the commit path at all:
      # .pre-commit-config.yaml.
      - name: Validate TOML against published schemas
        uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5
        with:
          extra_args: --hook-stage manual --all-files tombi-lint-online
