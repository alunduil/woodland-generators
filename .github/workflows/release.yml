name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Tag foundry-module releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write

    # release-please prefixes every output with the package path once a
    # manifest config names one, so these have to be read by index and are
    # republished here under names `needs` expressions can reach.
    outputs:
      released: ${{ steps.release-please.outputs['packages/foundry-module--release_created'] }}
      tag: ${{ steps.release-please.outputs['packages/foundry-module--tag_name'] }}

    steps:
      # Tags pushed with the default GITHUB_TOKEN don't trigger workflows.
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.PAT_TOKEN }}

  # release-please opens the release, but leaves it empty. Foundry installs a
  # module from a manifest URL naming a zip, so both have to hang off the
  # release before the manifest URL resolves to anything installable.
  publish-module:
    name: Attach the module to its GitHub Release
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    timeout-minutes: 15
    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      # esbuild resolves the sibling packages through their dist/, so the whole
      # workspace builds before the module can bundle.
      - name: Build every package
        run: pnpm run build

      - name: Assemble the release assets
        run: pnpm --filter @woodland-generators/foundry-module run package

      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            packages/foundry-module/release/module.json \
            packages/foundry-module/release/module.zip \
            --clobber
