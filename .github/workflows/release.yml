name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Tag foundry-module releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write

    # release-please path-prefixes every output, so these can only be read by
    # index.
    outputs:
      released: ${{ steps.release-please.outputs['packages/foundry-module--release_created'] }}
      tag: ${{ steps.release-please.outputs['packages/foundry-module--tag_name'] }}

    steps:
      # Tags pushed with the default GITHUB_TOKEN don't trigger workflows.
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.PAT_TOKEN }}

  # release-please opens the release and leaves it empty. Foundry installs from
  # a manifest URL naming a zip, so both assets have to hang off it.
  publish-module:
    name: Attach the module to its GitHub Release
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    timeout-minutes: 15
    permissions:
      contents: write

    # The packaging script reads this to check the tag against module.json.
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      # esbuild resolves the sibling packages through their dist/, so the whole
      # workspace builds first.
      - name: Build every package
        run: pnpm run build

      - name: Assemble the release assets
        run: pnpm --filter @woodland-generators/foundry-module run package

      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            packages/foundry-module/release/module.json \
            packages/foundry-module/release/module.zip \
            --clobber

  # A world installs from the manifest URL, never from this repository, so the
  # assets are checked where Foundry reads them rather than where they were
  # built. Skipped along with publish-module when no release was cut.
  verify-release:
    name: Check the published release installs
    runs-on: ubuntu-latest
    needs: [release-please, publish-module]
    timeout-minutes: 10

    # The verifier expects this version at the latest-release pointer.
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install the module from its manifest URL
        run: pnpm --filter @woodland-generators/foundry-module run verify:release
