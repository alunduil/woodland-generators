name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    name: Enforce Conventional Commits
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test

      - name: Checkout release-please config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: release-please-config.json
          sparse-checkout-cone-mode: false

      # A breaking marker bumps the version and lands under BREAKING CHANGES
      # even on a type release-please hides, so the changelog would announce a
      # break it never explains.
      - name: Reject breaking marker on hidden types
        env:
          TITLE: ${{ github.event.pull_request.title }}
          # A refactor can still remove something a world relies on.
          BREAKABLE_HIDDEN_TYPES: refactor
        run: |
          [[ $TITLE =~ ^([a-z]+)(\([^\)]*\))?!: ]] || exit 0
          type=${BASH_REMATCH[1]}
          [[ " $BREAKABLE_HIDDEN_TYPES " == *" $type "* ]] && exit 0
          jq -e --arg type "$type" \
            '.["changelog-sections"] | any(.type == $type and .hidden)' \
            release-please-config.json > /dev/null || exit 0
          echo "::error::'$type!' marks a breaking change on a type hidden" \
            "from the changelog. Drop the '!' or use a visible type."
          exit 1
