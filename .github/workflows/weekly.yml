name: Weekly

on:
  schedule:
    # Fridays at 18:00 Europe/London. The timezone field (GitHub Actions
    # support added March 2026) handles BST/GMT automatically.
    - cron: "0 18 * * 5"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ref-less group so a manual dispatch and the schedule can't run
  # concurrently and race on the shared report issue; cancel rather than
  # queue so a fresh dispatch supersedes an in-flight run.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # External URLs rot independently of our diffs, so checking them per-PR
  # produces flaky failures. Verify them weekly and open an issue on breakage
  # rather than blocking the line. Never fails the run.
  external-links:
    name: Check external links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads lychee.toml from the repo root, so the #288 resilience tuning
      # (retry_wait_time, cache_exclude_status, accept list) applies here too.
      # Foundry manifests carry url, readme, license and bugs URLs that no
      # other gate resolves; the pre-commit hook runs --offline and skips them.
      - name: Check all links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress "**/*.md" "packages/*/module.json"
          fail: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Reuse the open report if one exists so repeated breakage updates a
      # single issue instead of filing a new one every week.
      - name: Find existing report issue
        if: steps.lychee.outputs.exit_code != 0
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'Link Checker Report in:title' --json number --jq '.[0].number // empty')
          echo "number=${number}" >> "${GITHUB_OUTPUT}"

      - name: Open or update issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.report.outputs.number }}
          labels: documentation, automated

  # The token's owner is an admin, and admins bypass the required-checks
  # ruleset, so the merge API would accept a red pull request. The job checks
  # the ruleset's contexts itself before merging.
  release-pr:
    name: Merge the pending release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      # A merge with the default GITHUB_TOKEN starts no push run, so the
      # Release workflow would never tag it.
      - name: Merge the release PR once its required checks pass
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh api "repos/${REPO}/pulls?state=open&base=main&per_page=100" \
            --jq '[.[] | select(any(.labels[]; .name == "autorelease: pending"))][0]
                  // empty | "\(.number) \(.head.sha) \(.title)"')
          if [[ -z "${pr}" ]]; then
            echo "No pending release PR."
            exit 0
          fi
          read -r number sha title <<< "${pr}"

          required=$(gh api "repos/${REPO}/rules/branches/main" \
            --jq '.[] | select(.type == "required_status_checks")
                  | .parameters.required_status_checks[].context' | sort -u)
          if [[ -z "${required}" ]]; then
            echo "::error::main has no required status checks to gate the merge on."
            exit 1
          fi
          passed=$(gh api --paginate "repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .name' | sort -u)
          missing=$(comm -23 <(echo "${required}") <(echo "${passed}"))
          if [[ -n "${missing}" ]]; then
            echo "::notice::Release PR #${number} not merged; required checks not passed: ${missing//$'\n'/, }"
            exit 0
          fi

          # Pinning the sha refuses the merge if release-please pushed after
          # the checks were read.
          gh api --method PUT "repos/${REPO}/pulls/${number}/merge" \
            -f merge_method=squash -f sha="${sha}" -f commit_title="${title} (#${number})"
