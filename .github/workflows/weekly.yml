name: Weekly

on:
  schedule:
    # Fridays at 18:00 Europe/London. The timezone field (GitHub Actions
    # support added March 2026) handles BST/GMT automatically.
    - cron: "0 18 * * 5"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ref-less group so a manual dispatch and the schedule can't run
  # concurrently and race on the shared report issue; cancel rather than
  # queue so a fresh dispatch supersedes an in-flight run.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # External URLs rot independently of our diffs, so checking them per-PR
  # produces flaky failures. Verify them weekly and open an issue on breakage
  # rather than blocking the line. Never fails the run.
  external-links:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Reads lychee.toml from the repo root, so the #288 resilience tuning
      # (retry_wait_time, cache_exclude_status, accept list) applies here too.
      # Foundry manifests carry url, readme, license and bugs URLs that no
      # other gate resolves; the pre-commit hook runs --offline and skips them.
      - name: Check all links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress "**/*.md" "packages/*/module.json"
          fail: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: ./.github/actions/report-issue
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: documentation, automated

  # Dev-only advisories arrive through upstream chains we can't fix, so they
  # surface here as an issue rather than blocking CI, which gates production
  # dependencies only. Never fails the run.
  dependency-audit-report:
    name: Report advisories across every dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Audit every dependency
        id: audit
        run: |
          if pnpm audit >audit.txt 2>&1; then
            echo "found=false" >>"${GITHUB_OUTPUT}"
          else
            echo "found=true" >>"${GITHUB_OUTPUT}"
          fi
          {
            echo '```text'
            cat audit.txt
            echo '```'
          } >audit.md

      - name: Open or update issue on advisories
        if: steps.audit.outputs.found == 'true'
        uses: ./.github/actions/report-issue
        with:
          title: Dependency Audit Report
          content-filepath: ./audit.md
          labels: dependencies, automated
