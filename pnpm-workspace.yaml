packages:
  - "packages/*"
blockExoticSubdeps: false
overrides:
  # Neither tinymce nor showdown enters shipped code: foundry-vtt-types
  # contributes them as types only, and Foundry VTT supplies both at runtime.
  # tinymce sits past the declared ^6.8.5 because its XSS advisories resolve
  # only in 7.x. showdown has no fixed release to pin to.
  tinymce: 7.9.3
allowBuilds:
  esbuild: true
  unrs-resolver: true
