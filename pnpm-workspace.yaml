packages:
  - "packages/*"
blockExoticSubdeps: false
overrides:
  # tinymce never enters shipped code: foundry-vtt-types contributes it as
  # types only, and Foundry VTT supplies it at runtime. It sits past the
  # declared ^6.8.5 because its XSS advisories resolve only in 7.x.
  tinymce: 8.0.0
allowBuilds:
  # Prebuilt binaries ship in per-platform optional packages. The install
  # script compiles only when npm_config_build_from_source is true.
  "@parcel/watcher": false
  esbuild: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    # showdown never enters shipped code: foundry-vtt-types contributes it as
    # types only, and Foundry VTT supplies it at runtime. No fixed release
    # exists.
    - GHSA-rmmh-p597-ppvv
    - GHSA-cr32-g25g-vxjj
    - GHSA-22g5-r2x5-97cx
