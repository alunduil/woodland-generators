packages:
  - "packages/*"
catalog:
  # typescript-eslint and ts-jest can't load TypeScript 7. The 6.x `typescript`
  # package installs its own `tsc`, which collides with @typescript/native's.
  typescript: npm:@typescript/typescript6@6.0.2
blockExoticSubdeps: false
overrides:
  # tinymce never enters shipped code: foundry-vtt-types contributes it as
  # types only, and Foundry VTT supplies it at runtime. It sits past the
  # declared ^6.8.5 because every release in that range carries XSS
  # advisories.
  tinymce: 8.10.2
allowBuilds:
  # Prebuilt binaries ship in per-platform optional packages. The install
  # script compiles only when npm_config_build_from_source is true.
  "@parcel/watcher": false
  esbuild: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    # showdown never enters shipped code: foundry-vtt-types contributes it as
    # types only, and Foundry VTT supplies it at runtime. No fixed release
    # exists.
    - GHSA-rmmh-p597-ppvv
    - GHSA-cr32-g25g-vxjj
    - GHSA-22g5-r2x5-97cx
