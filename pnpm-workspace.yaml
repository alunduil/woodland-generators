packages:
  - "packages/*"
blockExoticSubdeps: false
overrides:
  # tinymce never enters shipped code: foundry-vtt-types contributes it as
  # types only, and Foundry VTT supplies it at runtime. It sits past the
  # declared ^6.8.5 because its XSS advisories resolve only in 7.x.
  tinymce: 7.9.3
allowBuilds:
  # The install script only compiles when build-from-source is requested;
  # prebuilt binaries arrive as per-platform optional dependencies.
  "@parcel/watcher": false
  esbuild: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    # showdown never enters shipped code: foundry-vtt-types contributes it as
    # types only, and Foundry VTT supplies it at runtime. No fixed release
    # exists.
    - GHSA-rmmh-p597-ppvv
    - GHSA-cr32-g25g-vxjj
    - GHSA-22g5-r2x5-97cx
